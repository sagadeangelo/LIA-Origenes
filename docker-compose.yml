name: lia-origenes-documental
services:
  archivo:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: origenes
      POSTGRES_USER: origenes
      POSTGRES_PASSWORD: ${ORIGENES_PG_PASSWORD:?Configura la clave de la biblioteca}
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - biblioteca:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U origenes -d origenes"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  biblioteca:
